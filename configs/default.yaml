# Default run configuration for tonematcher.
# Real values come from .env (paths) + per-phase configs; this is a starting skeleton.

audio:
  sample_rate: 48000      # Hz; rendering / analysis rate
  mono: true              # collapse to mono for analysis

hosting:
  block_size: 8192        # samples per render block
  # plugin_dir / plugin_path are read from .env, not committed here.

metric:
  kind: mrstft            # baseline; later: afx_rep (ST-ITO) | openamp
  mrstft:
    fft_sizes: [1024, 2048, 512]
    hop_sizes: [120, 240, 50]
    win_lengths: [600, 1200, 240]

optimize:
  backend: cma            # cma | nevergrad
  budget: 200             # max render evaluations
  seed: 0
